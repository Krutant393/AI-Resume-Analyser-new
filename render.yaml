services:
  # ---------------------------------------------------------------------------
  # Backend Express Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-resume-analyser-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini

  # ---------------------------------------------------------------------------
  # Frontend React (Vite) Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: ai-resume-analyser-frontend
    rootDir: ai-resume-analyser
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-resume-analyser-backend
          property: host
